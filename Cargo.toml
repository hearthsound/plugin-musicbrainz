[package]
name = "hearthsound-plugin-musicbrainz"
version = "0.5.3"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A Hearthsound metadata plugin backed by the MusicBrainz web service"
repository = "https://github.com/hearthsound/plugin-musicbrainz"

[lib]
crate-type = ["cdylib"]

[dependencies]
hearthsound-plugin = { git = "https://github.com/hearthsound/plugin-sdk", tag = "v0.5.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
